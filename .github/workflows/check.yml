name: Writing and coding checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test the read-only checker
        run: python -m unittest discover -s tests -v
      - name: Test paragraph annotation contracts
        run: python -m unittest discover -s experiments/paragraph-functions -p 'test_*.py' -v
      - name: Test exploratory corpus measurements
        run: python -m unittest discover -s experiments/corpus-analysis-2026-11-16/tests -v
      - name: Test coding normalization and source bindings
        run: python -m unittest discover -s experiments/rule-calibration-2026-11-16/analysis -p 'test_*.py' -v
